name: Sync Gradle Wrapper

on:
  push:
    branches:
      - ci-fix-v1.4
    paths:
      - '.github/workflows/sync-gradle-wrapper.yml'

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Generate Gradle 9.5.0 wrapper
        working-directory: meter-reader
        run: gradle wrapper --gradle-version 9.5.0 --distribution-type bin
      - name: Commit generated wrapper
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add meter-reader/gradle meter-reader/gradlew meter-reader/gradlew.bat
          if git diff --cached --quiet; then
            echo 'Wrapper already present'
            exit 0
          fi
          git commit -m 'Generate Gradle 9.5.0 wrapper for exact mirror'
          git push
