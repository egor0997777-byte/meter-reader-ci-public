name: Meter Reader Emulator Regression
# CI provenance trigger: private head 35a749ed3d6ea48be7e26deeba2e6486695474a7 / meter-reader tree 89d1081104e0e5d6b9bc1ea6e9d9065af009fe6e

on:
  push:
    branches:
      - ci-fix-v1.4
      - ci-fix-v2.0
    paths:
      - 'meter-reader/**'
      - '.ci-source/retry-v10.txt'
      - '.github/scripts/android-preview.sh'
      - '.github/scripts/android-preview-v13-compat.sh'
      - '.github/scripts/android-v11-flow.sh'
      - '.github/scripts/android-v11-v14-compat.sh'
      - '.github/scripts/android-v12-db-check.sh'
      - '.github/scripts/android-v14-backup-restore.sh'
      - '.github/scripts/android-v14-backup-restore-compat.sh'
      - '.github/scripts/android-v14-fault-regression.sh'
      - '.github/scripts/android-v14-fault-regression-compat.sh'
      - '.github/scripts/android-v14-enospc.sh'
      - '.github/scripts/android-v14-app-lock.sh'
      - '.github/scripts/android-v14-kill-oversize.sh'
      - '.github/scripts/android-v20-shortcut.sh'
      - '.github/scripts/android-v20-kill-resume.sh'
      - '.github/scripts/android-v20-visual-edge.sh'
      - '.github/scripts/android-v20-upgrade-v10.sh'
      - '.github/scripts/android-v20-upgrade-v14.sh'
      - '.github/scripts/run-emulator-regressions.sh'
      - '.github/workflows/emulator-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: meter-reader
  APK_PATH: meter-reader/app/build/outputs/apk/debug/app-debug.apk
  PACKAGE_NAME: ru.egor.meters
  MAIN_ACTIVITY: .V13MainActivity
  V10_ARTIFACT_ZIP: /tmp/android-v1-release.zip

jobs:
  emulator-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prefetch exact v1.0 upgrade fixture
        if: github.ref_name == 'ci-fix-v2.0'
        env:
          V10_ARTIFACT_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-58a8-81f6-8e55-2b208debc1ee/raw?se=2026-09-10T09%3A08%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=f8e402a0-4948-5e82-af26-0b05b0b66da3&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T04%3A57%3A59Z&ske=2026-09-11T04%3A57%3A59Z&sks=b&skv=2026-02-06&sig=r0r988D2CAtp5d5LTXwLChIsOkU/YBWKD42ffTLjdMM%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$V10_ARTIFACT_ZIP" "$V10_ARTIFACT_URL"
          echo '9c445c371b7610da3519cc539d46500cf5f5b45a0d0639d4477fe95c9911afd3  '"$V10_ARTIFACT_ZIP" | sha256sum -c -

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate debug package
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null
          if [[ "$GITHUB_REF_NAME" == "ci-fix-v2.0" ]]; then
            grep -q 'versionCode = 200' meter-reader/app/build.gradle.kts
            grep -q 'versionName = "2.0.0"' meter-reader/app/build.gradle.kts
          else
            grep -q 'versionCode = 140' meter-reader/app/build.gradle.kts
            grep -q 'versionName = "1.4.0"' meter-reader/app/build.gradle.kts
          fi
          AAPT=$(find "${ANDROID_HOME:?}/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump permissions "$APK_PATH" | tee debug-permissions.txt
          if grep -q 'android.permission.INTERNET' debug-permissions.txt; then
            echo 'Unexpected INTERNET permission in built debug APK' >&2
            exit 1
          fi
          if grep -q 'android.permission.ACCESS_NETWORK_STATE' debug-permissions.txt; then
            echo 'Unexpected ACCESS_NETWORK_STATE permission in built debug APK' >&2
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run current-device emulator regressions
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 1200
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/run-emulator-regressions.sh"

      - name: Upload emulator regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meter-reader-${{ github.ref_name }}-emulator-logs
          path: emulator-regression-logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meter-reader-${{ github.ref_name }}-regression-screenshots
          path: android-preview-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meter-reader-${{ github.ref_name }}-emulator-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
